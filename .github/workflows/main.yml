name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: parent module

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        

      # ----------------------------------------------------------
      # Setup Terraform
      # ----------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ----------------------------------------------------------
      # 1. GITLEAKS - Secret Scanning
      # ----------------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
      


      # ----------------------------------------------------------
      # 2. TFLINT - Terraform Linting
      # ----------------------------------------------------------
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint


      # ----------------------------------------------------------
      # 3. TFSEC - Terraform Security Scan
      # ----------------------------------------------------------
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3


      # ----------------------------------------------------------
      # 4. CHECKOV - IaC Security & Compliance
      # ----------------------------------------------------------
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: parent module
     
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "5dbfcbf4-b70b-4ea1-991e-989b54697244" \
            --password "r0H8Q~ZmdhkTvMEMTfXz5rbS_z1FuXIuWpImWa.8" \
            --tenant "0566e7c0-ce72-4d83-a4b0-a667ea532764"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "0e3402ea-b30c-409a-9bbe-2dac4d43e202"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: parent module

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \  
            --username "5dbfcbf4-b70b-4ea1-991e-989b54697244" \
            --password "r0H8Q~ZmdhkTvMEMTfXz5rbS_z1FuXIuWpImWa.8" \
            --tenant "0566e7c0-ce72-4d83-a4b0-a667ea532764"

      - name: Set Azure Subscription
        run: |
          az account set \
           --subscription "0e3402ea-b30c-409a-9bbe-2dac4d43e202"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
